[package]
name = "devterm-gpui"
version = "1.6.7"
edition = "2021"
license = "MIT"
description = "DevTerm desktop terminal, rebuilt on Rust and GPUI"
publish = false

[lib]
name = "devterm_gpui"
path = "src/lib.rs"

[dependencies]
alacritty_terminal = "0.25"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
dirs = "5"
gpui = "0.2.2"
notify = "6"
portable-pty = "0.8.1"
russh = "0.49"
russh-keys = "0.49"
russh-sftp = "2.1"
serde_json = "1"
sha2 = "0.10"
ssh-key = "0.6"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "process"] }

# xattr 0.2.3 (pulled in by GPUI's archive crate) still names libc::ENOATTR,
# which newer libc removed. The vendor copy keeps the same 0.2.3 API.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
